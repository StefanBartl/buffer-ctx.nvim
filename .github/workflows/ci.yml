name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: stylua + luacheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Pinned (not "latest"): stylua's own rule changes between releases
      # would otherwise make this gate fail without any local diff to blame.
      - name: stylua (check only)
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check lua/ TESTS/

      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck 1.2.0

      - name: luacheck
        run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          luacheck lua/ TESTS/ plugin/
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-output-lint
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
          retention-days: 14

  test:
    name: headless specs (${{ matrix.os }}, Neovim ${{ matrix.nvim }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Three platforms on stable, plus nightly on Linux only -- deliberately
      # not the full 3x2 cross product. What nightly catches is Neovim API
      # drift, which is the same on every platform; what the os axis catches
      # is platform assumptions, which do not depend on the Neovim version.
      # Running both axes fully would double the jobs to re-answer questions
      # the four below already answer.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        nvim: [stable]
        include:
          - os: ubuntu-latest
            nvim: nightly
    defaults:
      run:
        # Windows runners default to PowerShell; one shell on all three keeps
        # the run step itself from being what differs between platforms.
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          path: buffer-ctx.nvim

      # lib.nvim is now a real runtime dependency of the default setup() path
      # (:Insert/:Copy/:Format/:Mark all require lib.nvim.usercmd.composer at
      # module load, not just lazily) as of the composer migration -- checked
      # out as a sibling so `rtp+=../lib.nvim` matches TESTS/run.lua's own
      # sibling-checkout lookup.
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: lib.nvim
          ref: ci-verified

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - name: Run TESTS/run.lua
        working-directory: buffer-ctx.nvim
        run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          nvim -n -i NONE --headless -u NONE -c "set rtp+=." -l TESTS/run.lua
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-output-test-${{ matrix.os }}-${{ matrix.nvim }}
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
          retention-days: 14

  health:
    name: checkhealth loads
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          path: buffer-ctx.nvim

      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: lib.nvim
          ref: ci-verified

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: setup() + :checkhealth buffer_ctx
        working-directory: buffer-ctx.nvim
        run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          nvim -n -i NONE --headless -u NONE \
            -c "set rtp+=.,../lib.nvim" \
            -c "lua require('buffer_ctx').setup({})" \
            -c "checkhealth buffer_ctx" \
            -c "qa!"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-output-health
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
          retention-days: 14
